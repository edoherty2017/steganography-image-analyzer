# Runs the pytest suite on every push and pull request.
#
# Job "tests": Python 3.11, 3.12 and 3.13 on Ubuntu with no display. tkinter
# is installed, so tests/test_gui.py imports gui.py and runs its non-window
# tests; every test that needs a real Tk window skips itself ("Tk cannot open
# a display").
#
# Job "gui": tests/test_gui.py under a virtual X server (xvfb-run), so the
# Tk window tests run too. The GUI tests were written and checked on macOS
# (Tk 9, aqua), so this job is allowed to fail without failing the workflow
# until it has been seen green on Linux.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Draw figures off-screen; no test opens a plot window.
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Tk (for tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Show versions
        run: |
          python --version
          python -m pip list
          python -c "import tkinter; print('Tk', tkinter.TkVersion)" || echo "tkinter not importable; tests/test_gui.py will be skipped"

      - name: Run tests
        run: python -m pytest -q -rs tests

  gui:
    name: pytest with a virtual display (Python 3.13, allowed to fail)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Tk and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk xvfb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run GUI tests under Xvfb
        run: xvfb-run -a python -m pytest -q -rs tests/test_gui.py
